<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-dark text-white p-3">
        <h2 class="container mb-0">Book Management</h2>
    </header>

    <main class="container my-4">
        <div class="row g-4">

            <form id="book-form" class="col-md-4 card p-3">
                <h5 id="form-title">Add Book</h5>

                <label for="id" class="form-label">ID</label>
                <input id="id" type="number" class="form-control mb-3" readonly>

                <label for="title" class="form-label">Title</label>
                <input id="title" type="text" class="form-control mb-3" required minlength="2">

                <label for="author" class="form-label">Author</label>
                <input id="author" type="text" class="form-control mb-3" required>

                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select mb-3" required>
                    <option value="">Select Category</option>
                    <option>Web</option>
                    <option>Programming</option>
                    <option>Database</option>
                    <option>Network</option>
                </select>

                <label for="price" class="form-label">Price</label>
                <input id="price" type="number" class="form-control mb-3" required min="1">

                <div>
                    <button id="save-button" class="btn btn-primary" type="submit">
                        Add
                    </button>

                    <button id="cancel-button" class="btn btn-secondary" type="button" hidden>
                        Cancel
                    </button>
                </div>

            </form>

            <section class="col-md-8 card p-3">

                <h5>Book List</h5>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="book-list"></tbody>
                    </table>
                </div>

            </section>
        </div>
    </main>
</body>

</html>
